name: "Terraform Destroy"

on:
  push:
    branches:
      - main

jobs:
  destroy:
    name: "Terraform Destroy"
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Increase total job timeout
    env:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_LOG: ERROR  # Reduce verbosity to speed up operations

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.0"

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Destroy
        working-directory: ./terraform
        run: |
           aws iam list-attached-user-policies --user-name bedrock-dev-view \
           --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null | \
           tr '\t' '\n' | while read arn; do
           [ -n "$arn" ] && aws iam detach-user-policy \
           --user-name bedrock-dev-view \
           --policy-arn "$arn" || true
           done

           terraform state rm 'aws_iam_user.bedrock_dev_view' 2>/dev/null || true

           timeout 1800 terraform destroy \
           -auto-approve \
           -input=false \
           -parallelism=20 \
           -no-color
