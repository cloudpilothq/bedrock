name: "Terraform CI/CD"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      # Assuming AWS credentials are provided via secrets
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.0"

      - name: Bootstrap S3 Backend Bucket
        run: |
          # This script checks if the S3 bucket exists, if not it creates it
          BUCKET_NAME="project-bedrock-tf-state-4492"
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket $BUCKET_NAME already exists."
          else
            echo "Creating bucket $BUCKET_NAME..."
            aws s3 mb s3://$BUCKET_NAME --region $AWS_REGION
            # Enable versioning
            aws s3api put-bucket-versioning --bucket $BUCKET_NAME --versioning-configuration Status=Enabled
          fi

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Format
        working-directory: ./terraform
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Plan
        working-directory: ./terraform
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      - name: Import Orphaned Resources
        working-directory: ./terraform
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          # Remove existing resources from state before importing
          terraform state rm aws_iam_role.eks_addon_role 2>/dev/null || true
          terraform state rm 'module.eks_blueprints_addons.aws_eks_addon.this["amazon-cloudwatch-observability"]' 2>/dev/null || true
          
          # Now import
          terraform import aws_iam_role.eks_addon_role bedrock-eks-addon-role || echo "IAM Role not found or already in state"
          terraform import 'module.eks_blueprints_addons.aws_eks_addon.this["amazon-cloudwatch-observability"]' project-bedrock-cluster:amazon-cloudwatch-observability || echo "Addon not found or already in state"
        continue-on-error: true

      - name: Terraform Apply
        working-directory: ./terraform
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          terraform apply -auto-approve
          terraform output -json > ../grading.json
          
      - name: Diagnose Helm Release
        if: failure()
        working-directory: ./terraform
        run: |
          aws eks update-kubeconfig --region us-east-1 --name project-bedrock-cluster
          helm list -a -n retail-app
          kubectl get pods -n retail-app
          kubectl describe pods -n retail-app || true


      - name: Commit grading.json
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add grading.json
          git commit -m "Update grading.json [skip ci]" || echo "No changes to commit"
          git push
